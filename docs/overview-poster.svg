<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640">
  <rect width="1200" height="640" fill="#ffffff"/>
  <rect width="1200" height="8" fill="#0f766e"/>
  <text x="60" y="90" font-family="sans-serif" font-size="64" font-weight="bold" fill="#111827">CausalLab</text>
  <text x="60" y="140" font-family="sans-serif" font-size="28" fill="#374151">experimentation and causal inference workbench</text>
  <text x="60" y="180" font-family="sans-serif" font-size="22" fill="#6b7280">fake users, a real lift to recover, and methods checked against the truth.</text>

  <rect x="60" y="220" width="340" height="190" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
  <text x="84" y="262" font-family="sans-serif" font-size="24" font-weight="bold" fill="#111827">1. run an experiment</text>
  <text x="84" y="298" font-family="sans-serif" font-size="20" fill="#374151">2000 fake users, split</text>
  <text x="84" y="328" font-family="sans-serif" font-size="20" fill="#374151">control / treatment.</text>
  <text x="84" y="358" font-family="sans-serif" font-size="20" fill="#374151">true lift 5.0, measured</text>
  <text x="84" y="388" font-family="sans-serif" font-size="20" fill="#374151">lift 6.95 (se 1.19).</text>

  <rect x="430" y="220" width="340" height="190" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
  <text x="454" y="262" font-family="sans-serif" font-size="24" font-weight="bold" fill="#111827">2. cut the noise</text>
  <text x="454" y="298" font-family="sans-serif" font-size="20" fill="#374151">CUPED uses pre-period</text>
  <text x="454" y="328" font-family="sans-serif" font-size="20" fill="#374151">spend to strip out</text>
  <text x="454" y="358" font-family="sans-serif" font-size="20" fill="#374151">predictable noise.</text>
  <text x="454" y="388" font-family="sans-serif" font-size="20" fill="#374151">se 1.19 -&gt; 0.45.</text>

  <rect x="800" y="220" width="340" height="190" rx="12" fill="#f9fafb" stroke="#9ca3af" stroke-width="2"/>
  <text x="824" y="262" font-family="sans-serif" font-size="24" font-weight="bold" fill="#111827">3. next up</text>
  <text x="824" y="298" font-family="sans-serif" font-size="20" fill="#374151">sequential testing:</text>
  <text x="824" y="328" font-family="sans-serif" font-size="20" fill="#374151">peek early, stay honest.</text>
  <text x="824" y="358" font-family="sans-serif" font-size="20" fill="#374151">then who benefits most,</text>
  <text x="824" y="388" font-family="sans-serif" font-size="20" fill="#374151">and a live dashboard.</text>

  <rect x="60" y="450" width="1080" height="120" rx="12" fill="#111827"/>
  <text x="84" y="498" font-family="sans-serif" font-size="22" fill="#ffffff">real numbers from an actual run:</text>
  <text x="84" y="538" font-family="sans-serif" font-size="22" fill="#d1d5db">variance 716.5 -&gt; 110.0 with CUPED, noise cut 62.4%, 468 users per group to detect lift 5.0</text>
</svg>
